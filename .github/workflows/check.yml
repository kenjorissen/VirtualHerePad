name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            Makefile
            ruff.toml
      - name: Install shell development tools
        run: sudo apt-get update && sudo apt-get install -y make shellcheck
      - name: Lint and test (no Qt)
        run: make check
      - name: Install pinned Qt for offscreen UI tests
        run: python -m pip install PySide6-Essentials==6.11.2 shiboken6==6.11.2
      - name: Test with Qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test
